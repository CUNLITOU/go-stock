name: Wails build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0-release). Required for creating a release.'
        required: false
        type: string
      channel:
        description: 'Release channel'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - pre
          - dev

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  OFFICIAL_STATEMENT: ${{ vars.OFFICIAL_STATEMENT }}
  BUILD_KEY: ${{ secrets.BUILD_KEY || vars.BUILD_KEY }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'go-stock-windows-amd64.exe'
            platform:  'windows/amd64'
            os: 'windows-latest'
          - name: 'go-stock-windows-arm64.exe'
            platform:  'windows/arm64'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get commit message
        id: get_commit_message
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=format:'%s' | tr -d '"' | tr -d "'" | tr -d '\\')
          echo "commit_message=$MSG" >> $GITHUB_OUTPUT

      - name: Build wails x go-stock
        uses: ArvinLovegood/wails-build-action@v3.9
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: true
          go-version: '1.27'
          build-tags: ${{ github.ref_name || 'manual' }}
          build-commit-message: ${{ steps.get_commit_message.outputs.commit_message }}
          build-statement: ${{ env.OFFICIAL_STATEMENT }}
          build-key: ${{ env.BUILD_KEY }}
          node-version: '22.22.2'
          wails-version: 'v2.15.0'
          nsis: 'true'

      - name: Upload artifact
        if: steps.build.outputs.binary_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: ${{ steps.build.outputs.binary_path }}

  release:
    name: Create GitHub Release
    needs: build
    if: ${{ inputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine prerelease and channel label
        id: channel
        shell: bash
        run: |
          CHANNEL="${{ inputs.channel }}"
          TAG="${{ inputs.tag_name }}"
          if [[ "$TAG" == *-release ]]; then
            CHANNEL="release"
          elif [[ "$TAG" == *-pre ]]; then
            CHANNEL="pre"
          elif [[ "$TAG" == *-dev ]]; then
            CHANNEL="dev"
          fi
          case "$CHANNEL" in
            release)
              echo "prerelease=false" >> $GITHUB_OUTPUT
              echo "channel_label=Release（稳定版）" >> $GITHUB_OUTPUT
              echo "make_latest=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "prerelease=true" >> $GITHUB_OUTPUT
              echo "channel_label=${CHANNEL}（预发布版）" >> $GITHUB_OUTPUT
              echo "make_latest=false" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: go-stock ${{ inputs.tag_name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.zip
            release-artifacts/**/*.yml
          body: |
            ## go-stock ${{ steps.channel.outputs.channel_label }}
            
            手动构建于 ${{ github.run_date }}
